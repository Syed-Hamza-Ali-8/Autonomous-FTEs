[project]
name = "email-mcp-server"
version = "2.0.0"
description = "Email MCP Server for Silver Tier AI Assistant - Official FastMCP Pattern"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-auth>=2.47.0",
    "google-api-python-client>=2.187.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
    "selenium>=4.40.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
