apiVersion: v1
kind: Secret
metadata:
  name: fte-secrets
  namespace: customer-success-fte
type: Opaque
stringData:
  # OpenAI API Key
  OPENAI_API_KEY: "your-openai-api-key-here"

  # Database credentials
  POSTGRES_PASSWORD: "fte_password_change_me"
  DATABASE_URL: "postgresql+asyncpg://fte_user:fte_password_change_me@postgres:5432/customer_success_fte"

  # Gmail credentials (base64 encoded JSON)
  GMAIL_CREDENTIALS: "{}"

  # Twilio credentials
  TWILIO_ACCOUNT_SID: "your-twilio-account-sid"
  TWILIO_AUTH_TOKEN: "your-twilio-auth-token"
  TWILIO_WHATSAPP_NUMBER: "whatsapp:+14155238886"

  # Redis (if needed)
  REDIS_URL: "redis://redis:6379/0"
