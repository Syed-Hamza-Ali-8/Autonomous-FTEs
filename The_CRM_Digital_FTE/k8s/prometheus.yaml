apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: customer-success-fte
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape API pods
      - job_name: 'fte-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - customer-success-fte
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:8000
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # Scrape worker pods
      - job_name: 'fte-worker'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - customer-success-fte
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: worker

    # Alerting rules
    rule_files:
      - /etc/prometheus/alerts.yml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: customer-success-fte
data:
  alerts.yml: |
    groups:
      - name: fte_alerts
        interval: 30s
        rules:
          # High error rate
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }} errors/sec"

          # API pod down
          - alert: APIPodDown
            expr: up{job="fte-api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "API pod is down"
              description: "{{ $labels.pod }} has been down for more than 2 minutes"

          # High response latency
          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response latency"
              description: "P95 latency is {{ $value }}s"

          # Database connection issues
          - alert: DatabaseConnectionFailed
            expr: database_health == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Database connection failed"
              description: "Cannot connect to PostgreSQL"

          # Kafka connection issues
          - alert: KafkaConnectionFailed
            expr: kafka_health == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Kafka connection failed"
              description: "Cannot connect to Kafka"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: customer-success-fte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: prometheus-alerts
          mountPath: /etc/prometheus/alerts.yml
          subPath: alerts.yml
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-alerts
        configMap:
          name: prometheus-alerts
      - name: prometheus-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: customer-success-fte
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
