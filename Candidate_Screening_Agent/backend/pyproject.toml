[project]
name = "candidate-screening-agent"
version = "0.1.0"
description = "Autonomous candidate screening Digital FTE powered by Grok + OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "openai-agents",
    "openai>=1.0.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.29.0",
    "alembic==1.13.0",
    "redis[asyncio]==5.0.0",
    "pdfplumber==0.11.0",
    "python-dotenv==1.0.0",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.0",
    "google-api-python-client==2.149.0",
    "apscheduler==3.10.4",
    "python-multipart==0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx==0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db", "services", "watchers", "routers"]
py-modules = ["main", "screening_agent", "orchestrator", "daily_digest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "pytest-mock>=3.14.0",
]
