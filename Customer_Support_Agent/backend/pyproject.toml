[project]
name = "tollgate"
version = "0.1.0"
description = "Tollgate: customer support agent that takes safe actions"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "openai-agents>=0.24.0",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "jsonschema==4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "time-machine>=3.6.0",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]  # pytest asserts; subprocess with fixed argv, no shell

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
